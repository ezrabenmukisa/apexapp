name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  injectable: ^3.0.0
  intl: ^0.20.3
  logger: ^2.8.0
  material_ui: ^1.7.0
  pinput: ^7.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/Newsreader/OFL.txt
    - assets/fonts/HankenGrotesk/OFL.txt
    - assets/fonts/IBMPlexMono/OFL.txt

  # Bundled so text renders correctly offline on first launch.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader/Newsreader-SemiBold.ttf
          weight: 600
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk/HankenGrotesk-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-SemiBold.ttf
          weight: 600
